name: release
on:
  push:
    tags: ['v*.*.*', 'v*.*.*-*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make
      - name: Check version
        run: |
          TAG="${GITHUB_REF_NAME%%-*}"
          TAG="${TAG#v}"
          MAKE_VER="$(sed -n 's/^VERSION = //p' Makefile)"
          [ "$TAG" = "$MAKE_VER" ] || { echo "Tag $TAG != Makefile $MAKE_VER"; exit 1; }
      - run: make test
      - run: make dist-win
      - uses: actions/upload-artifact@v4
        with:
          name: salvoq-exe
          path: dist/salvoq.exe
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: salvoq-exe
          path: dist
      - run: cd dist && sha256sum salvoq.exe > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && ARGS="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/salvoq.exe dist/SHA256SUMS.txt $ARGS --generate-notes
